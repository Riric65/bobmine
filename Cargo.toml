[package]
name = "bobminer"
version = "0.1.0"
edition = "2021"
description = "Mineur de BobCoins pour l'API bobphone (hashcash SHA-256)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["compress"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
